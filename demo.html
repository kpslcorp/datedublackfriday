<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Friday – Compte à rebours</title>
  <meta name="description" content="Compte à rebours Black Friday, auto mise à jour chaque année, affichage Today le jour J, reset automatique le lendemain." />
  <style>
    :root{
      --bg:#0b0d12; --bg2:#0f1220; --card:#121525; --ink:#eef2ff; --muted:#a7b0c6;
      --accent:#7df9e6; --accent2:#60a5fa; --glow:rgba(96,165,250,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:radial-gradient(1200px 800px at 80% -10%, #13223a 0%, transparent 60%),
                         radial-gradient(1200px 800px at -10% 110%, #10231e 0%, transparent 60%),
                         linear-gradient(180deg,var(--bg),var(--bg2));
         color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif;}

    .shell{min-height:100%; display:grid; place-items:center; padding:24px}
    .card{width:min(980px,100%); background:color-mix(in oklab, var(--card) 80%, black 20%);
          border:1px solid #1e233a; border-radius:24px; padding:28px; position:relative;
          box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.02) inset;}
    .card::after{content:""; position:absolute; inset:-2px; border-radius:26px; pointer-events:none;
                 background:linear-gradient(120deg, transparent 0 20%, color-mix(in oklab, var(--accent) 40%, transparent) 33%, color-mix(in oklab, var(--accent2) 40%, transparent) 66%, transparent 80%);
                 filter:blur(14px); opacity:.35;}

    header{display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between}
    h1{font-size:clamp(28px,5vw,44px); line-height:1.05; margin:0}
    .sub{color:var(--muted); font-size:clamp(14px,2.5vw,16px)}

    .status{display:flex; gap:12px; align-items:center; margin:14px 0 6px}
    .pill{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px;
          background:#0f172a; border:1px solid #222a4a; color:var(--ink);}
    .dot{width:8px; height:8px; border-radius:50%; background:conic-gradient(from 0deg, var(--accent), var(--accent2)); box-shadow:0 0 12px var(--glow)}

    .grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-top:16px}
    @media (max-width:700px){ .grid{grid-template-columns:repeat(2, minmax(0,1fr));} }

    .tile{background:linear-gradient(180deg, #0c1020, #0a0d18); border:1px solid #1b2242; border-radius:18px; padding:16px; text-align:center; position:relative; overflow:hidden}
    .tile::before{content:""; position:absolute; inset:0; background:radial-gradient(120% 120% at 50% -10%, rgba(125,249,230,.1), transparent 40%), radial-gradient(120% 120% at 50% 120%, rgba(96,165,250,.08), transparent 40%)}
    .label{color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-weight:600; font-size:12px}
    .value{font-variant-numeric:tabular-nums; font-size:clamp(40px,10vw,72px); font-weight:800; line-height:1; margin-top:6px;
           text-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0.01px #fff}

    .year{font-weight:700; color:var(--ink)}

    .cta{margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .btn{appearance:none; border:1px solid #1b2242; background:#0d1326; color:var(--ink); padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:700}
    .btn:hover{border-color:#2a3160}

    .today{font-size:clamp(18px,4.5vw,26px); font-weight:900; letter-spacing:.02em; display:flex; align-items:center; gap:10px}
    .today .burst{display:inline-block; width:10px; height:10px; border-radius:50%; background:conic-gradient(from 0deg, var(--accent), var(--accent2)); box-shadow:0 0 18px var(--glow)}

    footer{margin-top:18px; color:var(--muted); font-size:13px}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <div class="shell">
    <main class="card" role="region" aria-labelledby="title">
      <header>
        <h1 id="title">Black Friday – Compte à rebours <span class="year" id="yearLabel"></span></h1>
        <p class="sub" id="dateLabel">Calcul automatique de la date chaque année (4ᵉ jeudi de novembre + 1 jour).</p>
      </header>

      <div class="status">
        <span class="pill"><span class="dot" aria-hidden="true"></span><span id="statusText">Initialisation…</span></span>
      </div>

      <section aria-live="polite" aria-atomic="true">
        <div class="grid" id="grid">
          <div class="tile"><div class="label">Jours</div><div class="value" id="d">0</div></div>
          <div class="tile"><div class="label">Heures</div><div class="value" id="h">0</div></div>
          <div class="tile"><div class="label">Minutes</div><div class="value" id="m">0</div></div>
          <div class="tile"><div class="label">Secondes</div><div class="value" id="s">0</div></div>
        </div>
        <div id="todayBanner" class="today" style="display:none; margin-top:12px"><span class="burst" aria-hidden="true"></span> Today</div>
      </section>

      <div class="cta">
        <button class="btn" id="addCalendar">Ajouter au calendrier (.ics)</button>
        <button class="btn" id="copyDate">Copier la date</button>
      </div>

      <footer id="foot"></footer>
	  <p>&copy; Ce tool vous est proposé gratuitement par <a href="https://blackfridayfrance.com/" target="_blank">Black Friday France</a></p>
    </main>
  </div>

  <script>
  (function(){
    const el = id=>document.getElementById(id);
    const dEl=el('d'), hEl=el('h'), mEl=el('m'), sEl=el('s');
    const statusEl=el('statusText');
    const yearLabel=el('yearLabel');
    const dateLabel=el('dateLabel');
    const todayBanner=el('todayBanner');
    const grid=el('grid');
    const foot=el('foot');

    // Helpers
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);

    function getThanksgivingDate(year){
      // 4th Thursday of November (US Thanksgiving)
      const nov1 = new Date(year, 10, 1); // month index 10 = November
      const day = nov1.getDay(); // 0=Sun..6=Sat
      const firstThu = 1 + ((4 - day + 7) % 7); // date of first Thursday in Nov
      const fourthThu = firstThu + 21; // +3 weeks
      return new Date(year, 10, fourthThu);
    }
    function getBlackFridayDate(year){
      const tg = getThanksgivingDate(year);
      const bf = new Date(tg); bf.setDate(tg.getDate()+1);
      return bf; // local time
    }

    function formatDateLong(d){
      return new Intl.DateTimeFormat('fr-FR', {weekday:'long', year:'numeric', month:'long', day:'numeric'}).format(d);
    }

    function computeTarget(now){
      const yearNow = now.getFullYear();
      const bfThis = getBlackFridayDate(yearNow);
      const bfStart = startOfDay(bfThis);
      const bfEnd = endOfDay(bfThis);
      if (now < bfStart) return {year: yearNow, when: bfStart, state:'before'};
      if (now >= bfStart && now <= bfEnd) return {year: yearNow, when: bfStart, state:'today'};
      // After Black Friday -> next year
      const next = getBlackFridayDate(yearNow+1);
      return {year: next.getFullYear(), when: startOfDay(next), state:'after'};
    }

    let rafId = null;
    function tick(){
      const now = new Date();
      const target = computeTarget(now);
      const {year, when, state} = target;

      yearLabel.textContent = year;
      dateLabel.textContent = `Prochain Black Friday : ${formatDateLong(when)}`;

      // UI state
      if(state === 'today'){
        statusEl.textContent = `C'est aujourd'hui !`;
        grid.style.display = 'none';
        todayBanner.style.display = 'flex';
      } else {
        statusEl.textContent = `Prochain évènement`;
        grid.style.display = 'grid';
        todayBanner.style.display = 'none';
      }

      const diff = when - now; // ms until start of BF day
      if (diff > 0) {
        const sec = Math.floor(diff/1000);
        const days = Math.floor(sec / 86400);
        const hours = Math.floor((sec % 86400)/3600);
        const mins = Math.floor((sec % 3600)/60);
        const secs = sec % 60;

        dEl.textContent = days.toString();
        hEl.textContent = hours.toString().padStart(2,'0');
        mEl.textContent = mins.toString().padStart(2,'0');
        sEl.textContent = secs.toString().padStart(2,'0');
      } else {
        // diff <= 0 means we're on the day or past start; let computeTarget handle state
        if(state !== 'today'){
          // If we've crossed the day after, next frame will recompute to next year
        }
      }

      const bfThisYear = getBlackFridayDate(new Date().getFullYear());
      const info = (state==='today') ? `Jour J : ${formatDateLong(bfThisYear)}` : `Calcul basé sur le 4ᵉ jeudi de novembre (Thanksgiving) + 1 jour.`;
      foot.textContent = info;

      rafId = window.requestAnimationFrame(tick);
    }

    // Buttons
    el('copyDate').addEventListener('click', () => {
      const now = new Date();
      const {when} = computeTarget(now);
      navigator.clipboard.writeText(formatDateLong(when)).then(()=>{
        statusEl.textContent = 'Date copiée dans le presse papiers';
        setTimeout(()=>statusEl.textContent='Prochain évènement', 1600);
      }).catch(()=>{});
    });

    el('addCalendar').addEventListener('click', () => {
      const now = new Date();
      const {when} = computeTarget(now);
      // Create all day event for Black Friday local time
      const dtStart = new Date(when.getFullYear(), when.getMonth(), when.getDate());
      const dtEnd = new Date(when.getFullYear(), when.getMonth(), when.getDate()+1);
      const fmt = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/, 'Z');
      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//bf-countdown//FR',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:bf-${when.getFullYear()}@local`,
        `DTSTAMP:${fmt(new Date())}`,
        `DTSTART;VALUE=DATE:${fmt(dtStart).slice(0,8)}`,
        `DTEND;VALUE=DATE:${fmt(dtEnd).slice(0,8)}`,
        `SUMMARY:Black Friday ${when.getFullYear()}`,
        'DESCRIPTION:Black Friday – évènement annuel',
        'END:VEVENT',
        'END:VCALENDAR' 
      ].join('\r\n');

      const blob = new Blob([ics], {type:'text/calendar'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `black-friday-${when.getFullYear()}.ics`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    tick();
    window.addEventListener('visibilitychange', ()=>{ if(document.hidden){cancelAnimationFrame(rafId);} else {tick();} });
  })();
  </script>
</body>
</html>
